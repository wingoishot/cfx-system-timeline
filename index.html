<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: #0d1117;
  color: #e6edf3;
  font-size: 13px;
  line-height: 1.5;
}

/* Nav bar */
.nav-bar {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 8px 24px;
  background: #161b22;
  border-bottom: 1px solid #30363d;
  font-size: 14px;
}
.nav-brand {
  font-weight: 700;
  color: #39d2b4;
  font-size: 15px;
}
.nav-link {
  color: #7d8590;
  cursor: default;
  text-decoration: none;
}
.nav-link.active {
  background: #30363d;
  color: #e6edf3;
  padding: 4px 12px;
  border-radius: 6px;
  font-weight: 500;
}

/* Page content */
.page-content { padding: 24px; }
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
}
.page-title { font-size: 20px; font-weight: 600; }
.page-subtitle { font-size: 13px; color: #7d8590; margin-top: 2px; }

/* Sync badge */
.sync-badge {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 4px;
  font-weight: 500;
  white-space: nowrap;
}
.sync-badge.live { background: #1a3a2a; color: #39d2b4; border: 1px solid #26563b; }
.sync-badge.error { background: #3b1c1c; color: #e5534b; border: 1px solid #5b2c2c; }
.sync-badge.loading { background: #2a2520; color: #e6a117; border: 1px solid #4a3510; }
.sync-badge.embedded { background: #2a2520; color: #e6a117; border: 1px solid #4a3510; }

/* ---- Gantt chart ---- */
.gantt-wrapper {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 8px;
  overflow: hidden;
}

.gantt-scroll { overflow-x: auto; }

.gantt {
  min-width: 960px;
  --act-col: 280px;
  --prog-col: 72px;
}

/* ---- Header rows ---- */
.gantt-header-year,
.gantt-header-month {
  display: grid;
  grid-template-columns: var(--act-col) var(--prog-col) 1fr;
}

/* Activity / Progress header cells — span both rows visually */
.gh-label,
.gh-prog-label {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: #e6edf3;
  background: #21262d;
  border-right: 1px solid #30363d;
  border-bottom: 1px solid #30363d;
  padding: 0 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.gh-label { justify-content: flex-start; padding-left: 16px; }

/* Year band */
.gh-years {
  display: flex;
  border-bottom: 1px solid #30363d;
}
.gh-year-cell {
  flex: 1;
  text-align: center;
  padding: 6px 0;
  font-size: 15px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 0.06em;
  border-right: 1px solid rgba(255,255,255,0.15);
}
.gh-year-cell:last-child { border-right: none; }
.gh-year-cell.y2026 { background: #c23b34; }
.gh-year-cell.y2027 { background: #1a5fc9; }

/* Month band */
.gh-months {
  display: flex;
  border-bottom: 1px solid #30363d;
}
.gh-month-cell {
  flex: 1;
  text-align: center;
  padding: 5px 0;
  font-size: 12px;
  font-weight: 600;
  color: #fff;
  border-right: 1px solid rgba(255,255,255,0.08);
}
.gh-month-cell:last-child { border-right: none; }
.gh-month-cell.m2026 { background: rgba(194, 59, 52, 0.35); }
.gh-month-cell.m2027 { background: rgba(26, 95, 201, 0.35); }

/* Empty header cells for month row */
.gh-empty {
  background: #21262d;
  border-right: 1px solid #30363d;
  border-bottom: 1px solid #30363d;
}

/* ---- Section header row ---- */
.gantt-section {
  display: grid;
  grid-template-columns: 1fr;
  background: #21262d;
  border-bottom: 1px solid #30363d;
  cursor: pointer;
  transition: background 0.15s;
}
.gantt-section:hover { background: #272c35; }
.gantt-section-inner {
  padding: 9px 16px;
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.collapse-icon {
  font-size: 9px;
  color: #7d8590;
  transition: transform 0.2s;
  display: inline-block;
  width: 14px;
  flex-shrink: 0;
}
.gantt-section.expanded .collapse-icon { transform: rotate(90deg); }

/* ---- Task row ---- */
.gantt-row {
  display: grid;
  grid-template-columns: var(--act-col) var(--prog-col) 1fr;
  border-bottom: 1px solid #1c2129;
  transition: background 0.1s;
}
.gantt-row:hover { background: #1c2129; }

.gr-activity {
  padding: 10px 16px 10px 36px;
  font-size: 13px;
  border-right: 1px solid #30363d;
  display: flex;
  align-items: center;
}
.gr-activity.completed {
  color: #484f58;
  text-decoration: line-through;
}
.gr-activity.milestone::before {
  content: "\25C6";
  margin-right: 6px;
  font-size: 9px;
  color: #7d8590;
  flex-shrink: 0;
}

.gr-progress {
  padding: 10px 8px;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  border-right: 1px solid #30363d;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #7d8590;
}

/* ---- Timeline cell ---- */
.gr-timeline {
  position: relative;
  height: 40px;
  overflow: hidden;
}

/* Month grid lines */
.grid-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: #21262d;
  pointer-events: none;
  z-index: 1;
}

/* Today line */
.today-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  z-index: 8;
  pointer-events: none;
  border-left: 2px dashed rgba(255,255,255,0.45);
}

/* Gantt bar */
.gantt-bar {
  position: absolute;
  height: 20px;
  top: 50%;
  transform: translateY(-50%);
  border-radius: 3px;
  z-index: 3;
  min-width: 6px;
  cursor: default;
}

/* Milestone diamond */
.gantt-diamond {
  position: absolute;
  width: 14px;
  height: 14px;
  top: 50%;
  transform: translateY(-50%) rotate(45deg);
  border-radius: 2px;
  z-index: 4;
  cursor: default;
}

/* TBD label */
.tbd-label {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  color: #484f58;
  font-style: italic;
}

/* Section tasks container */
.section-tasks {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}
.gantt-section.expanded + .section-tasks {
  max-height: 2000px;
}

/* Legend */
.gantt-legend {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  padding: 10px 20px;
  font-size: 11px;
  color: #7d8590;
  border-top: 1px solid #21262d;
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-swatch {
  width: 20px;
  height: 10px;
  border-radius: 2px;
}
.legend-diamond-swatch {
  width: 10px;
  height: 10px;
  transform: rotate(45deg);
  border-radius: 1px;
}
.legend-today-swatch {
  width: 0;
  height: 14px;
  border-left: 2px dashed rgba(255,255,255,0.45);
}
.legend-sep { color: #30363d; }

/* Tooltip */
.tip {
  display: none;
  position: fixed;
  background: #1c2129;
  border: 1px solid #30363d;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px;
  color: #e6edf3;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  z-index: 100;
  pointer-events: none;
  max-width: 320px;
  line-height: 1.6;
}
.tip.visible { display: block; }
.tip-title { font-weight: 600; margin-bottom: 4px; }
.tip-meta { color: #7d8590; font-size: 11px; }

/* Embed mode */
body.embed .nav-bar { display: none; }
body.embed .page-content { padding: 0; }
body.embed .page-header { display: none; }
body.embed .gantt-wrapper { border: none; border-radius: 0; }
</style>

// --- Config ---
var MONTHS = [
  { label: "Jul", year: 2026, month: 6 },
  { label: "Aug", year: 2026, month: 7 },
  { label: "Sep", year: 2026, month: 8 },
  { label: "Oct", year: 2026, month: 9 },
  { label: "Nov", year: 2026, month: 10 },
  { label: "Dec", year: 2026, month: 11 },
  { label: "Jan", year: 2027, month: 0 },
  { label: "Feb", year: 2027, month: 1 },
  { label: "Mar", year: 2027, month: 2 },
  { label: "Apr", year: 2027, month: 3 },
  { label: "May", year: 2027, month: 4 },
  { label: "Jun", year: 2027, month: 5 }
];

var TL_START = new Date(2026, 6, 1);
var TL_END   = new Date(2027, 6, 1);
var TL_MS    = TL_END - TL_START;

var SECTION_COLORS = {
  "cat-ota":      "#e5534b",
  "cat-factory":  "#a78bfa",
  "cat-progress": "#3b82f6",
  "cat-upcoming": "#f59e0b",
  "cat-done":     "#484f58"
};

function dateToPct(dateStr) {
  if (!dateStr) return null;
  var d = new Date(dateStr + "T00:00:00");
  return Math.max(0, Math.min(100, ((d - TL_START) / TL_MS) * 100));
}

function todayPct() {
  return Math.max(0, Math.min(100, ((new Date() - TL_START) / TL_MS) * 100));
}

function calcProgress(task) {
  if (task.completed) return 100;
  var now = new Date();
  if (task.start && task.due) {
    var s = new Date(task.start + "T00:00:00");
    var e = new Date(task.due + "T00:00:00");
    if (e <= s) return 0;
    if (now >= e) return 100;
    if (now <= s) return 0;
    return Math.round(((now - s) / (e - s)) * 100);
  }
  if (task.due) {
    return now >= new Date(task.due + "T00:00:00") ? 100 : 0;
  }
  return 0;
}

function fmtDate(dateStr) {
  if (!dateStr) return "TBD";
  var d = new Date(dateStr + "T00:00:00");
  return String(d.getMonth() + 1).padStart(2, "0") + "/" +
         String(d.getDate()).padStart(2, "0") + "/" +
         String(d.getFullYear()).slice(2);
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

function gridLinesHTML(tPct) {
  var html = "";
  for (var i = 1; i < 12; i++) {
    var pct = (i / 12) * 100;
    html += '<div class="grid-line" style="left:' + pct + '%"></div>';
  }
  html += '<div class="today-line" style="left:' + tPct + '%"></div>';
  return html;
}

function render() {
  var gantt = document.getElementById("gantt");
  var tPct = todayPct();
  var gl = gridLinesHTML(tPct);
  var h = "";

  // --- Header: year row ---
  h += '<div class="gantt-header-year">';
  h += '<div class="gh-label">Activity</div>';
  h += '<div class="gh-prog-label">Progress</div>';
  h += '<div class="gh-years">';
  h += '<div class="gh-year-cell y2026">2026</div>';
  h += '<div class="gh-year-cell y2027">2027</div>';
  h += '</div></div>';

  // --- Header: month row ---
  h += '<div class="gantt-header-month">';
  h += '<div class="gh-empty"></div>';
  h += '<div class="gh-empty"></div>';
  h += '<div class="gh-months">';
  MONTHS.forEach(function(m) {
    var cls = m.year === 2026 ? "m2026" : "m2027";
    h += '<div class="gh-month-cell ' + cls + '">' + m.label + '</div>';
  });
  h += '</div></div>';

  // --- Sections & tasks ---
  TASKS.forEach(function(section, si) {
    var isDone = section.cat === "cat-done";
    var expanded = !isDone;
    var color = SECTION_COLORS[section.cat] || "#39d2b4";

    // Section header
    h += '<div class="gantt-section' + (expanded ? " expanded" : "") + '" onclick="toggleSection(this)" data-index="' + si + '">';
    h += '<div class="gantt-section-inner">';
    h += '<span class="collapse-icon">&#9654;</span>';
    h += '<span>' + section.section + '</span>';
    h += '<span style="font-size:11px;color:#7d8590;font-weight:400;margin-left:4px">(' + section.tasks.length + ')</span>';
    h += '</div></div>';

    // Task rows
    h += '<div class="section-tasks">';
    section.tasks.forEach(function(t) {
      var prog = calcProgress(t);
      var isMilestone = t.resource_subtype === "milestone";
      var completedCls = t.completed ? " completed" : "";

      h += '<div class="gantt-row">';

      // Activity cell
      h += '<div class="gr-activity' + completedCls + (isMilestone ? " milestone" : "") + '" title="' + esc(t.name) + '">' + t.name + '</div>';

      // Progress cell
      h += '<div class="gr-progress">' + prog + '%</div>';

      // Timeline cell
      h += '<div class="gr-timeline">' + gl;

      if (t.start && t.due) {
        var sPct = dateToPct(t.start);
        var ePct = dateToPct(t.due);
        var w = Math.max(0.4, ePct - sPct);
        h += '<div class="gantt-bar" style="left:' + sPct + '%;width:' + w + '%;background:' + color + '"';
        h += ' data-tip="' + esc(t.name) + '"';
        h += ' data-dates="' + fmtDate(t.start) + ' – ' + fmtDate(t.due) + '"';
        h += ' data-assignee="' + (t.assignee || "Unassigned") + '"';
        h += ' data-section="' + section.section + '"';
        h += ' data-progress="' + prog + '%"';
        h += '></div>';
      } else if (t.due) {
        var pct = dateToPct(t.due);
        if (isMilestone) {
          h += '<div class="gantt-diamond" style="left:calc(' + pct + '% - 7px);background:' + color + '"';
        } else {
          h += '<div class="gantt-bar" style="left:calc(' + pct + '% - 3px);width:6px;background:' + color + '"';
        }
        h += ' data-tip="' + esc(t.name) + '"';
        h += ' data-dates="Due: ' + fmtDate(t.due) + '"';
        h += ' data-assignee="' + (t.assignee || "Unassigned") + '"';
        h += ' data-section="' + section.section + '"';
        h += ' data-progress="' + prog + '%"';
        h += '></div>';
      } else {
        h += '<span class="tbd-label">Dates TBD</span>';
      }

      h += '</div></div>';
    });
    h += '</div>';
  });

  gantt.innerHTML = h;

  // --- Legend ---
  var legend = document.getElementById("gantt-legend");
  var lh = "";
  TASKS.forEach(function(section) {
    var c = SECTION_COLORS[section.cat] || "#39d2b4";
    lh += '<div class="legend-item"><div class="legend-swatch" style="background:' + c + '"></div>' + section.section + '</div>';
  });
  lh += '<span class="legend-sep">|</span>';
  lh += '<div class="legend-item"><div class="legend-today-swatch"></div> Today</div>';
  lh += '<span class="legend-sep">&middot;</span>';
  lh += '<span>Click section to expand/collapse</span>';
  legend.innerHTML = lh;
}

function toggleSection(el) {
  el.classList.toggle("expanded");
}

// --- Tooltip ---
var tipEl = document.getElementById("tip");
document.addEventListener("mouseover", function(e) {
  var el = e.target.closest("[data-tip]");
  if (!el) { tipEl.classList.remove("visible"); return; }
  tipEl.innerHTML =
    '<div class="tip-title">' + el.dataset.tip + '</div>' +
    '<div class="tip-meta">' + el.dataset.dates + '</div>' +
    '<div class="tip-meta">Assignee: ' + el.dataset.assignee + '</div>' +
    '<div class="tip-meta">Progress: ' + el.dataset.progress + '</div>' +
    '<div class="tip-meta" style="font-weight:500">' + el.dataset.section + '</div>';
  tipEl.classList.add("visible");
});
document.addEventListener("mousemove", function(e) {
  if (!tipEl.classList.contains("visible")) return;
  var x = e.clientX + 12, y = e.clientY + 12;
  var r = tipEl.getBoundingClientRect();
  if (x + r.width > window.innerWidth - 12) x = e.clientX - r.width - 12;
  if (y + r.height > window.innerHeight - 12) y = e.clientY - r.height - 12;
  tipEl.style.left = x + "px";
  tipEl.style.top = y + "px";
});
document.addEventListener("mouseout", function(e) {
  if (e.target.closest("[data-tip]")) tipEl.classList.remove("visible");
});

// --- Asana live sync ---
var ASANA_PAT = "2/1208717380462980/1218142428533819:12448cbda0fbf36a8831453b49b12d65";
var PROJECT_GID = "1218045518949399";
var SECTION_MAP = {
  "OTA Releases":        "cat-ota",
  "Factory Releases":    "cat-factory",
  "In Progress":         "cat-progress",
  "Upcoming Priorities": "cat-upcoming",
  "Done":                "cat-done"
};
var SECTION_ORDER = Object.keys(SECTION_MAP);

function parseAsanaData(data) {
  var buckets = {};
  for (var name in SECTION_MAP)
    buckets[name] = { section: name, cat: SECTION_MAP[name], tasks: [] };
  for (var i = 0; i < data.length; i++) {
    var item = data[i];
    var mem = (item.memberships || []).find(function(m) { return SECTION_MAP[m.section.name]; });
    if (!mem) continue;
    var t = { name: item.name, completed: item.completed, assignee: (item.assignee || {}).name || null, resource_subtype: item.resource_subtype || "default_task" };
    if (item.due_on) t.due = item.due_on;
    if (item.start_on) t.start = item.start_on;
    buckets[mem.section.name].tasks.push(t);
  }
  return SECTION_ORDER.map(function(s) { return buckets[s]; }).filter(Boolean);
}

var statusEl;
function setStatus(text, cls) {
  if (!statusEl) statusEl = document.getElementById("sync-status");
  statusEl.textContent = text;
  statusEl.className = "sync-badge " + cls;
}

var HAS_EMBEDDED = TASKS.length > 0;

if (HAS_EMBEDDED) {
  render();
  var embeddedCount = TASKS.reduce(function(s, sec) { return s + sec.tasks.length; }, 0);
  setStatus("Embedded (" + embeddedCount + " tasks)", "embedded");
} else {
  render();
  setStatus("Loading…", "loading");
  if (ASANA_PAT && !ASANA_PAT.startsWith("@@")) {
    var apiUrl = "https://app.asana.com/api/1.0/projects/" + PROJECT_GID
      + "/tasks?opt_fields=name,completed,assignee.name,resource_subtype,due_on,start_on,memberships.section.name&limit=100";
    fetch(apiUrl, { headers: { "Authorization": "Bearer " + ASANA_PAT } })
      .then(function(r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(json) {
        TASKS = parseAsanaData(json.data);
        render();
        setStatus("Live Data (" + json.data.length + " tasks)", "live");
      })
      .catch(function(e) {
        console.error("[cfx-sync] Error:", e);
        setStatus("Sync error: " + e.message, "error");
      });
  } else {
    setStatus("No PAT configured", "embedded");
  }
}

// Notify parent frame of content height for auto-resize
if (document.body.classList.contains("embed") && window.parent !== window) {
  function notifyHeight() {
    window.parent.postMessage({ type: "cfx-resize", height: document.documentElement.scrollHeight }, "*");
  }
  new MutationObserver(notifyHeight).observe(document.getElementById("gantt"), { childList: true, subtree: true });
  window.addEventListener("resize", notifyHeight);
  setTimeout(notifyHeight, 200);
  setTimeout(notifyHeight, 1000);
}
</script>
