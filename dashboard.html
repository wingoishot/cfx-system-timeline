<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program Hub - Software</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: #0d1117;
  color: #e6edf3;
  font-size: 14px;
  line-height: 1.5;
}

/* ---- Nav bar ---- */
.nav-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 24px;
  height: 42px;
  background: #161b22;
  border-bottom: 1px solid #30363d;
  font-size: 14px;
}
.nav-brand {
  font-weight: 700;
  color: #39d2b4;
  font-size: 15px;
  margin-right: 16px;
}
.nav-link {
  color: #7d8590;
  text-decoration: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: color 0.15s;
}
.nav-link:hover { color: #e6edf3; }
.nav-link.active {
  background: #30363d;
  color: #e6edf3;
  font-weight: 500;
}
.nav-dropdown::after { content: " \25BE"; font-size: 10px; }

/* ---- Page chrome ---- */
.page-content { padding: 24px 24px 48px; }

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 20px;
}
.page-title { font-size: 22px; font-weight: 600; }
.page-subtitle { font-size: 13px; color: #7d8590; margin-top: 2px; }

.header-actions { display: flex; align-items: center; gap: 12px; }

.badge {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 4px;
  font-weight: 500;
  white-space: nowrap;
}
.badge-live { background: #1a3a2a; color: #39d2b4; border: 1px solid #26563b; }
.badge-loading { background: #2a2520; color: #e6a117; border: 1px solid #4a3510; }

/* ---- Initiative cards ---- */
.initiative-cards { display: flex; flex-direction: column; gap: 20px; }

.initiative-card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 8px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.initiative-card:hover { border-color: #484f58; }

.card-chrome {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 14px 20px;
  cursor: pointer;
  user-select: none;
}
.card-chrome:hover { background: #1c2129; }

.card-left { display: flex; align-items: flex-start; gap: 10px; }
.card-collapse {
  color: #7d8590;
  font-size: 12px;
  margin-top: 3px;
  transition: transform 0.2s;
  display: inline-block;
}
.initiative-card.collapsed .card-collapse { transform: rotate(-90deg); }
.card-icon { font-size: 18px; margin-top: 1px; }
.card-title { font-size: 15px; font-weight: 600; }
.card-subtitle { font-size: 12px; color: #7d8590; margin-top: 1px; }

.card-body {
  transition: max-height 0.35s ease, opacity 0.25s ease;
  max-height: 2000px;
  opacity: 1;
  overflow: hidden;
}
.initiative-card.collapsed .card-body {
  max-height: 0;
  opacity: 0;
}

.card-frame {
  width: 100%;
  border: none;
  display: block;
  min-height: 200px;
  background: #161b22;
}

/* Placeholder card */
.placeholder-card {
  background: transparent;
  border: 2px dashed #30363d;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.placeholder-card:hover {
  border-color: #484f58;
  background: rgba(22, 27, 34, 0.5);
}
.placeholder-inner {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #7d8590;
  font-size: 14px;
}
.placeholder-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: #21262d;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #484f58;
}
</style>
</head>
<body>

<div class="nav-bar">
  <span class="nav-brand">Program Hub</span>
  <a class="nav-link">Home</a>
  <a class="nav-link">Transformation Agenda</a>
  <a class="nav-link nav-dropdown">Portfolio Views</a>
  <a class="nav-link active nav-dropdown">Roadmaps</a>
</div>

<div class="page-content">
  <div class="page-header">
    <div>
      <div class="page-title">Software</div>
      <div class="page-subtitle" id="page-subtitle">All Teams &middot; FY27 Planning</div>
    </div>
    <div class="header-actions">
      <span class="badge badge-live" id="live-badge">Live Data</span>
    </div>
  </div>

  <div class="initiative-cards" id="cards">
    <!-- CFX-System -->
    <div class="initiative-card" data-src="index.html?embed">
      <div class="card-chrome" onclick="toggleCard(this)">
        <div class="card-left">
          <span class="card-collapse">&#9660;</span>
          <div>
            <div class="card-title">SW &mdash; CFx &middot; CFX-System</div>
            <div class="card-subtitle">FY27 &middot; Grouped by release category</div>
          </div>
        </div>
      </div>
      <div class="card-body">
        <iframe class="card-frame" data-src="index.html?embed"></iframe>
      </div>
    </div>

    <!-- Device Services -->
    <div class="initiative-card" data-src="device-services.html?embed">
      <div class="card-chrome" onclick="toggleCard(this)">
        <div class="card-left">
          <span class="card-collapse">&#9660;</span>
          <div>
            <div class="card-title">SW &mdash; Device Services Roadmap</div>
            <div class="card-subtitle">CY2026 &middot; Grouped by initiative</div>
          </div>
        </div>
      </div>
      <div class="card-body">
        <iframe class="card-frame" data-src="device-services.html?embed"></iframe>
      </div>
    </div>

    <!-- Placeholder -->
    <div class="placeholder-card" onclick="addInitiative()">
      <div class="placeholder-inner">
        <div class="placeholder-icon">+</div>
        <span>Add Initiative</span>
      </div>
    </div>
  </div>
</div>

<script>
// Lazy-load iframes when they scroll into view
var observer = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) {
    if (entry.isIntersecting) {
      var frame = entry.target;
      if (frame.dataset.src && !frame.src) {
        frame.src = frame.dataset.src;
      }
      observer.unobserve(frame);
    }
  });
}, { rootMargin: "200px" });

document.querySelectorAll("iframe[data-src]").forEach(function(f) { observer.observe(f); });

// Auto-resize iframes via postMessage from embedded timelines
window.addEventListener("message", function(e) {
  if (e.data && e.data.type === "cfx-resize") {
    var frames = document.querySelectorAll(".card-frame");
    frames.forEach(function(f) {
      if (f.contentWindow === e.source) {
        f.style.height = e.data.height + "px";
      }
    });
  }
});

// Collapse / expand cards
function toggleCard(chrome) {
  chrome.closest(".initiative-card").classList.toggle("collapsed");
}

// Count initiatives
function updateCount() {
  var n = document.querySelectorAll(".initiative-card").length;
  document.getElementById("page-subtitle").innerHTML =
    "All Teams &middot; FY27 Planning &middot; " + n + " initiative" + (n !== 1 ? "s" : "");
}
updateCount();

function addInitiative() {
  alert("Connect an Asana project to add a new initiative timeline.");
}
</script>
</body>
</html>
